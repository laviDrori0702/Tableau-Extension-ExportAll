services:
  - type: web
    runtime: static
    name: tableau-extension-exportall
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    headers:
      # Tableau embeds the extension in an iframe.
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      # Download the manifest instead of rendering it as XML.
      - path: /ExportAll.trex
        name: Content-Type
        value: application/octet-stream
      - path: /ExportAll.trex
        name: Content-Disposition
        value: attachment; filename="ExportAll.trex"
    # Order is load-bearing: first match wins, so the catch-all rewrite goes last.
    routes:
      - type: redirect
        source: /download
        destination: /ExportAll.trex
      # Keep the manifest out of the catch-all rather than relying on Render
      # serving an existing file ahead of a rewrite.
      - type: rewrite
        source: /ExportAll.trex
        destination: /ExportAll.trex
      # SPA: /configure and /desktopexport are client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
