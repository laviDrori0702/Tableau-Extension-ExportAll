services:
  - type: web
    runtime: static
    name: tableau-extension-exportall
    # No `plan` key: static sites have no instance type, and the validator
    # rejects `plan: free` with "no such plan free for service type web".
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    headers:
      # Tableau embeds the extension in an iframe.
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      # Download the manifest instead of rendering it as XML.
      - path: /ExportAll.trex
        name: Content-Type
        value: application/octet-stream
      - path: /ExportAll.trex
        name: Content-Disposition
        value: attachment; filename="ExportAll.trex"
    # Order is load-bearing: first match wins, so the catch-all rewrite goes last.
    # /ExportAll.trex and the static assets get no explicit route — Render serves a
    # real file from the publish dir ahead of applying a rewrite. (An identity
    # rewrite is rejected: "source cannot be the same as destination".)
    routes:
      - type: redirect
        source: /download
        destination: /ExportAll.trex
      # SPA: /configure and /desktopexport are client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
