on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

jobs:
  build:
    name: Build and Upload Release Asset
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only, so creating the release needs this.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Regression gate: a new high/critical finding in a runtime dependency
      # fails the release before anything is published.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build release
        run: npm run release
      # Layout matches the pre-SEC-4 artifact: everything nested under build/.
      - name: Create zip archive
        run: zip -qq -r ${{ github.ref_name }}.zip build
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: ${{ github.ref_name }}.zip
